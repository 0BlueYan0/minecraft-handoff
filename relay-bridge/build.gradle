plugins { id 'fabric-loom' }
evaluationDependsOn(':relay-core')
version = '0.2.0'
group = 'tw.handoff'
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods { handoff_relay { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
    implementation project(':relay-core')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8'; options.compilerArgs += ['--add-modules','jdk.attach'] }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar {
    dependsOn project(':relay-core').tasks.named('classes')
    from project(':relay-core').sourceSets.main.output
    manifest { attributes 'Main-Class':'tw.handoff.relay.agent.HostMain', 'Agent-Class':'tw.handoff.relay.agent.EntryAgent', 'Can-Redefine-Classes':'false', 'Can-Retransform-Classes':'false' }
}
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
test {
    useJUnitPlatform()
    dependsOn jar
    systemProperty 'handoff.bridgeDevJar', tasks.jar.archiveFile.get().asFile.absolutePath
    testLogging { events 'passed','failed','skipped' }
}
