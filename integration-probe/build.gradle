// Private-world test tool only. Never included in the delivered runtime package.
plugins { id 'fabric-loom' }
evaluationDependsOn(':sao-state')
version='0.2.0'
loom { splitEnvironmentSourceSets() }
dependencies {
 implementation project(':sao-state')
 minecraft 'com.mojang:minecraft:1.21.4'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.20.1'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
}
tasks.withType(JavaCompile).configureEach { options.release=21;options.encoding='UTF-8';options.compilerArgs += ['--add-modules','jdk.attach'] }
jar { manifest { attributes 'Main-Class':'tw.handoff.probe.ProbeMain','Agent-Class':'tw.handoff.probe.ProbeAgent' } }
