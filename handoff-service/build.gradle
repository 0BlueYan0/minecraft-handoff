plugins { id 'java' }
version='0.2.0'
repositories { mavenCentral() }
dependencies {
 implementation project(':viewer-bootstrap')
 implementation 'com.google.code.gson:gson:2.11.0'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8';options.compilerArgs += ['--add-modules','jdk.attach'] }
jar {
 duplicatesStrategy=DuplicatesStrategy.EXCLUDE
 manifest { attributes 'Main-Class':'tw.handoff.service.ServiceMain' }
 from { configurations.runtimeClasspath.collect { it.isDirectory()?it:zipTree(it) } }
 exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA'
}
test { useJUnitPlatform();testLogging { events 'passed','failed','skipped' } }
