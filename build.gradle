plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = project.maven_group

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        minecraft_handoff {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        agentSmoke {
            client()
            runDir 'run-agent-smoke'
            vmArg '-Xmx2G'
            vmArg '-Dhandoff.agentSmoke=true'
            vmArg '-Dfabric.debug.disableModIds=minecraft_handoff'
            programArgs '--username', 'HandoffSmoke', '--width', '854', '--height', '480'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

def modVersion = project.version.toString()
processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

test {
    useJUnitPlatform()
    // Optional override permits testing Java 21 bytecode with the game's Java 21 runtime.
    def runtimeHome = System.getenv('HANDOFF_TEST_JAVA_HOME')
    if (runtimeHome) {
        executable = new File(runtimeHome, "bin/java${org.gradle.internal.os.OperatingSystem.current().isWindows() ? '.exe' : ''}").absolutePath
    }
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

apply from: 'gradle/verify-artifact.gradle'
